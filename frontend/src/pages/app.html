<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Instagram Clone</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📷</text></svg>">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/feed.css">
  <link rel="stylesheet" href="../css/profile.css">
  <link rel="stylesheet" href="../css/edit-profile.css">
  <link rel="stylesheet" href="../css/app.css">
</head>
<body class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-logo">Instagram</div>
    <div class="sidebar-search">
      <div class="search-input-wrapper">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" id="searchInput" class="search-input" placeholder="Buscar usuários..." autocomplete="off" autocapitalize="none" spellcheck="false">
      </div>
      <div id="searchResults" class="search-results hidden"></div>
    </div>
    <nav class="sidebar-nav">
      <a href="#/home" class="sidebar-item" data-route="home"><i class="fa-solid fa-house nav-icon" data-icon-base="house"></i> <span>Home</span></a>
      <a href="#/create-post" class="sidebar-item" data-route="create-post"><i class="fa-solid fa-camera nav-icon"></i> <span>Criar</span></a>
      <a href="#/profile" class="sidebar-item" data-route="profile"><i class="fa-regular fa-circle-user nav-icon" data-icon-base="circle-user"></i> <span>Profile</span></a>
    </nav>
    <button class="sidebar-item logout-btn" id="logoutBtn">🚪 <span>Sair</span></button>
  </aside>

  <main class="main-area">
    <div id="app-content"></div>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/auth-guard.js"></script>
  <script src="../js/search.js"></script>
  <script src="../js/stories.js"></script>
  <script src="../js/home.js"></script>
  <script src="../js/profile.js"></script>
  <script src="../js/edit-profile.js"></script>
  <script src="../js/post.js"></script>
  <script src="../js/edit-post.js"></script>
  <script src="../js/create-post.js"></script>
  <script src="../js/router.js"></script>

  <script>
    registerRoute('home', renderHome);
    registerRoute('profile', renderProfile);
    registerRoute('profile/:id', renderProfile);
    registerRoute('edit-profile', renderEditProfile);
    registerRoute('post/:id', renderPost);
    registerRoute('create-post', renderCreatePost);
    registerRoute('edit-post/:id', renderEditPost);

    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('auth_token');
      localStorage.removeItem('current_user');
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
